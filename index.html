<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FitTrack</title>
<meta name="description" content="Kalorien, Nährstoffe und Training – einfach im Blick.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FitTrack">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<script src="vendor/zxing.min.js"></script>
</body>
</html>
<script src="vendor/anthropic.min.js"></script>
<style>
/* Layout: iOS-artig – große Titel, gruppierte Karten, Tab-Leiste unten, Sheets von unten */
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f6f6f9; --fg:#0b0b0f; --fg2:rgba(60,60,67,.64); --fg3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2); --seg-on:#ffffff;
  --accent:#1f9d47; --accent-fg:#ffffff; --kcal1:#34c759; --kcal2:#00bfb3; --ring-track:rgba(52,199,89,.16);
  --protein:#0a7cff; --carbs:#ff9500; --fat:#ff2d55;
  --orange:#ff9500; --red:#ff3b30; --green:#34c759; --teal:#30b0c7; --mint:#00c7be; --blue:#007aff; --purple:#af52de; --indigo:#5856d6; --pink:#ff2d55;
  --bar:rgba(249,249,251,.88); --scrim:rgba(0,0,0,.32); --shadow:0 1px 3px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --fg:#f5f5f7; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36); --seg-on:#636366;
  --accent:#30d158; --accent-fg:#00290d; --kcal1:#30d158; --kcal2:#40d6cf; --ring-track:rgba(48,209,88,.2);
  --protein:#0a84ff; --carbs:#ff9f0a; --fat:#ff375f;
  --orange:#ff9f0a; --red:#ff453a; --green:#30d158; --teal:#40c8e0; --mint:#63e6e2; --blue:#0a84ff; --purple:#bf5af2; --indigo:#5e5ce6; --pink:#ff375f;
  --bar:rgba(22,22,24,.86); --scrim:rgba(0,0,0,.55); --shadow:0 1px 3px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --fg:#f5f5f7; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36); --seg-on:#636366;
  --accent:#30d158; --accent-fg:#00290d; --kcal1:#30d158; --kcal2:#40d6cf; --ring-track:rgba(48,209,88,.2);
  --protein:#0a84ff; --carbs:#ff9f0a; --fat:#ff375f;
  --orange:#ff9f0a; --red:#ff453a; --green:#30d158; --teal:#40c8e0; --mint:#63e6e2; --blue:#0a84ff; --purple:#bf5af2; --indigo:#5e5ce6; --pink:#ff375f;
  --bar:rgba(22,22,24,.86); --scrim:rgba(0,0,0,.55); --shadow:0 1px 3px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg2)}
.small{font-size:13px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#view{max-width:620px;margin:0 auto;padding-block:6px calc(100px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:10px}
.hdr .eyebrow{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;margin:0 0 2px}
.hdr h1{font-size:34px;font-weight:700;letter-spacing:.005em;margin:0;line-height:1.1;text-wrap:balance}
.hdr-actions{display:flex;gap:8px}
.circle-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);color:var(--accent);display:grid;place-items:center}
.circle-btn:disabled{color:var(--fg3)}
.circle-btn .ico{width:18px;height:18px}
.pill-btn{border:0;background:var(--fill);color:var(--accent);border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px}

.card{background:var(--card);border-radius:var(--r);padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h2{font-size:18px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.card-h h2 .ico{width:20px;height:20px}
.section-title{font-size:20px;font-weight:700;margin:10px 4px 0}

/* Tageszusammenfassung */
.summary{display:flex;flex-direction:column;gap:18px}
.sum-top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring-wrap{position:relative;width:146px;height:146px;flex:none}
.ring-wrap svg{display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center b{font:700 32px/1 var(--round);font-variant-numeric:tabular-nums}
.ring-center span{font-size:12px;font-weight:600;color:var(--fg2);margin-top:4px}
.sum-lines{display:flex;flex-direction:column;gap:11px;min-width:0}
.sline{display:flex;align-items:center;gap:9px}
.sline .ico{width:17px;height:17px}
.sline small{display:block;font-size:12px;color:var(--fg2)}
.sline b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.mbars{display:flex;flex-direction:column;gap:12px}
.mbar-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.mbar-top span:first-child{font-weight:600}
.mbar-top span:last-child{color:var(--fg2);font-variant-numeric:tabular-nums;font-size:13px}
.track{height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:0;background:var(--card);border-radius:20px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile i{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff}
.tile i .ico{width:24px;height:24px;stroke-width:2.2}
.tile span{font-size:14px;font-weight:600}

.health-bar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;font-size:14px}
.health-bar .ico{color:var(--pink);width:20px;height:20px}
.health-bar div{flex:1;min-width:0}

/* Listen */
.group-h{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 6px;font-size:15px;font-weight:600}
.group-h span:first-child{display:flex;align-items:center;gap:7px}
.group-h .ico{width:18px;height:18px;color:var(--fg2)}
.group-h .num{color:var(--fg2);font-weight:600}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:50px;position:relative;width:100%;text-align:left;background:none;border:0;color:inherit}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
button.row:active{background:var(--fill)}
.row .grow{flex:1;min-width:0}
.row .title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{display:block;font-size:13px;color:var(--fg2);margin-top:1px}
.row .end{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .end small{font-weight:400;color:var(--fg2);font-size:12px;margin-left:2px}
.row .chev{color:var(--fg3);width:16px;height:16px}
.src{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--fg2);flex:none}
.src .ico{width:15px;height:15px}
.add-row{color:var(--accent);font-weight:500;font-size:15px}
.add-row .ico{width:20px;height:20px}
.dots{display:inline-flex;gap:8px;font-size:12px;color:var(--fg2)}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;vertical-align:1px}
.empty{padding:22px 18px;text-align:center;color:var(--fg2);font-size:15px}

/* Formularzeilen */
.frow{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:48px;position:relative}
.frow+.frow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.frow label,.frow .lbl{flex:1;min-width:0}
.frow .unit{color:var(--fg2);min-width:36px}
.inline{border:0;background:transparent;text-align:right;width:96px;padding:4px 0;font-variant-numeric:tabular-nums}
.inline:focus{outline:none;color:var(--accent)}
.frow select,.frow input[type=date],.frow input[type=datetime-local]{border:0;background:var(--fill);border-radius:8px;padding:6px 10px;max-width:60%}
.field{width:100%;border:0;background:var(--fill);border-radius:12px;padding:12px 14px}
.field:focus{outline:2px solid var(--accent);outline-offset:0}
.footnote{font-size:13px;color:var(--fg2);padding:6px 16px 0;line-height:1.4}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:7px 4px;font-size:13px;font-weight:500;border-radius:8px;white-space:nowrap}
.seg button.on{background:var(--seg-on);box-shadow:var(--shadow);font-weight:600}

.toggle{position:relative;width:51px;height:31px;flex:none}
.toggle input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;border-radius:99px;background:var(--fill2);transition:background .2s}
.toggle span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.toggle input:checked+span{background:var(--green)}
.toggle input:checked+span::after{transform:translateX(20px)}
.toggle input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:600;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98);opacity:.85}
.btn:disabled{opacity:.4}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-tinted{background:var(--fill);color:var(--accent)}
.btn-danger{background:var(--fill);color:var(--red)}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0}

/* Statistiken */
.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stat b{font:700 24px/1.1 var(--round);font-variant-numeric:tabular-nums}
.stat b small{font:600 13px var(--font);color:var(--fg2);margin-left:3px}
.stat span{display:block;font-size:12px;color:var(--fg2);margin-top:2px}
.chart{display:block;width:100%;height:auto;margin-top:14px;overflow:visible}
.chart text{fill:var(--fg2);font-size:10px;font-family:var(--font)}
.chart .grid{stroke:var(--sep);stroke-width:1}
.chart .target{stroke:var(--fg3);stroke-dasharray:4 4;stroke-width:1.2}
.progress{height:10px;border-radius:99px;background:var(--fill);overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--kcal1),var(--kcal2));border-radius:99px}
.week{display:grid;grid-template-columns:repeat(7,1fr);margin-top:16px;text-align:center}
.week small{display:block;font-size:11px;font-weight:600;color:var(--fg2);margin-bottom:6px}
.week i{display:grid;place-items:center;width:30px;height:30px;margin:0 auto;border-radius:50%;background:var(--fill);color:var(--accent-fg)}
.week i.on{background:var(--accent)}
.week i.today{box-shadow:inset 0 0 0 2px var(--accent)}
.week i .ico{width:15px;height:15px;stroke-width:3}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.wtile{border:0;background:var(--card);border-radius:18px;padding:13px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500;transition:transform .15s}
.wtile:active{transform:scale(.95)}
.wtile .ico{width:26px;height:26px}
.wicon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.wicon .ico{width:20px;height:20px}
.mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mtile{border-radius:14px;padding:12px 6px;text-align:center}
.mtile b{display:block;font:700 19px var(--round);font-variant-numeric:tabular-nums}
.mtile span{font-size:12px;color:var(--fg2)}
.big-kcal{font:700 54px/1 var(--round);font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--kcal1),var(--kcal2));-webkit-background-clip:text;background-clip:text;color:transparent}
.info-lines{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding-top:14px;border-top:.5px solid var(--sep);font-size:14px}
.info-lines div{display:flex;justify-content:space-between;gap:10px}
.info-lines span:first-child{color:var(--fg2)}
.info-lines span:last-child{font-weight:500;font-variant-numeric:tabular-nums}
details.help{background:var(--card);border-radius:14px;padding:14px 16px;font-size:14px}
details.help summary{font-weight:600;cursor:pointer;color:var(--accent)}
details.help ol{padding-left:20px;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--fill);padding:1px 5px;border-radius:5px}

/* Tab-Leiste */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#tabbar div{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--fg2);padding:4px 0}
#tabbar button .ico{width:25px;height:25px}
#tabbar button.on{color:var(--accent)}
#tabbar[hidden]{display:none!important}

/* Sheets */
#sheet-root{position:fixed;inset:0;z-index:40;pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;height:calc(100% - 44px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#sheet-root.open{pointer-events:auto}
#sheet-root.open .scrim{opacity:1}
#sheet-root.open .panel{transform:none}
.sh-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:8px}
.sh-head h3{margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.sh-head button{border:0;background:none;color:var(--accent);font-size:17px;padding:4px 0;display:flex;align-items:center;gap:2px}
.sh-head .r{justify-self:end;font-weight:600}
.sh-head .l{justify-self:start}
.sh-head button:disabled{color:var(--fg3)}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sh-body>*{flex-shrink:0}
.sh-foot{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bar);border-top:.5px solid var(--sep)}
.sh-foot:empty{display:none}

.photo{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);display:block;background:var(--fill)}
.hero-pick{background:var(--card);border-radius:var(--r);padding:26px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.hero-pick > .ico{width:52px;height:52px;stroke-width:1.5;color:var(--accent)}
.hero-pick h4{margin:0;font-size:20px}
.hero-pick p{margin:0;color:var(--fg2);font-size:15px;max-width:34ch}
.loading{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:16px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--fill2);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.alert .ico{color:var(--orange);margin-top:1px}
.ai-item{display:flex;gap:12px;padding:12px 16px;position:relative;align-items:flex-start}
.ai-item+.ai-item::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.ai-item.off{opacity:.45}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--fg3);background:none;display:grid;place-items:center;flex:none;margin-top:2px;padding:0;color:var(--accent-fg)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk .ico{width:14px;height:14px;stroke-width:3}
.ai-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.ai-name{border:0;background:none;font-weight:600;font-size:16px;padding:0;width:100%}
.ai-name:focus{outline:none;color:var(--accent)}
.stepper{display:inline-flex;align-items:center;background:var(--fill);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:none;width:34px;height:32px;font-size:20px;line-height:1;color:var(--fg)}
.stepper input{width:54px;border:0;background:none;text-align:center;font-variant-numeric:tabular-nums;padding:0}
.stepper input:focus{outline:none;color:var(--accent)}
.ai-kcal{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ai-kcal small{display:block;font-weight:400;font-size:12px;color:var(--fg2)}
.grams-big{display:flex;align-items:baseline;gap:6px;justify-content:center}
.grams-big input{width:150px;border:0;background:none;text-align:right;font:700 48px var(--round);font-variant-numeric:tabular-nums;padding:0}
.grams-big input:focus{outline:none;color:var(--accent)}
.grams-big span{font:600 24px var(--round);color:var(--fg2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.chips button{border:0;background:var(--fill);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:500}
.chips button.on{background:var(--accent);color:var(--accent-fg)}
.prod-head{display:flex;flex-direction:column;gap:2px;text-align:center;padding:4px 0}
.prod-head h4{margin:0;font-size:22px;text-wrap:balance}
.scanner{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:4/3;border:0;padding:0;border-radius:var(--r);overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#2a2d33,#0b0c0f);color:#fff}
.scanner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.scanner .frame{position:absolute;left:14%;right:14%;top:28%;bottom:28%}
.scanner .frame i{position:absolute;width:30px;height:30px;border:0 solid #fff}
.scanner .frame i:nth-child(1){top:0;left:0;border-top-width:4px;border-left-width:4px;border-top-left-radius:12px}
.scanner .frame i:nth-child(2){top:0;right:0;border-top-width:4px;border-right-width:4px;border-top-right-radius:12px}
.scanner .frame i:nth-child(3){bottom:0;left:0;border-bottom-width:4px;border-left-width:4px;border-bottom-left-radius:12px}
.scanner .frame i:nth-child(4){bottom:0;right:0;border-bottom-width:4px;border-right-width:4px;border-bottom-right-radius:12px}
.scanner .scan-ico{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.scanner .scan-ico .ico{width:30px;height:30px}
.scanner .laser{position:absolute;left:16%;right:16%;height:3px;border-radius:3px;background:#34c759;box-shadow:0 0 14px 2px #34c759;animation:laser 1.3s ease-in-out infinite alternate}
@keyframes laser{from{top:30%}to{top:70%}}
.scanner .cap{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-weight:600;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.scanner:active .scan-ico{transform:translate(-50%,-50%) scale(.92)}
.badge{display:inline-flex;align-items:center;gap:5px;align-self:center;margin-top:6px;font-size:12px;color:var(--fg2);background:var(--fill);border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums}
.badge .ico{width:13px;height:13px}
.amount{display:flex;align-items:center;justify-content:center;gap:14px}
.amount>button{width:46px;height:46px;border-radius:50%;border:0;background:var(--fill);color:var(--accent);font-size:26px;line-height:1;flex:none}
.amount>div{display:flex;align-items:baseline;gap:8px;justify-content:center;min-width:0}
.amount input{width:120px;border:0;background:none;text-align:right;font:700 44px var(--round);font-variant-numeric:tabular-nums;padding:0}
.amount input:focus{outline:none;color:var(--accent)}
.amount span{font:600 18px var(--round);color:var(--fg2);white-space:nowrap}
.set-row{display:flex;align-items:center;gap:10px;padding:8px 16px;position:relative}
.set-row+.set-row::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:.5px solid var(--sep)}
.set-no{width:26px;height:26px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--fg2);flex:none}
.set-w{width:64px;border:0;background:var(--fill);border-radius:8px;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
.icon-btn{border:0;background:none;color:var(--fg3);padding:6px;display:grid;place-items:center}
.icon-btn .ico{width:18px;height:18px}
.timer{text-align:center;padding:4px 0}
.timer b{font:700 52px/1 var(--round);font-variant-numeric:tabular-nums}
.timer span{display:block;color:var(--fg2);font-size:14px;margin-top:6px}
.ex-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.ex-head b{font-size:17px}
.ex-foot{padding:4px 16px 12px;font-size:13px;color:var(--fg2)}

/* Onboarding */
.ob{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;
  padding-block:24px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.ob h1{font-size:34px;margin:0;line-height:1.1;text-wrap:balance}
.ob .lead{color:var(--fg2);font-size:17px;margin:0}
.ob-top{display:flex;align-items:center;gap:14px}
.ob-top .progress{flex:1;margin:0;height:6px}
.feat{display:flex;gap:14px;align-items:flex-start}
.feat .ico{width:28px;height:28px;flex:none}
.feat b{display:block}
.feat span{color:var(--fg2);font-size:15px}
.sel{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--card);border-radius:18px;padding:14px;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s,transform .15s}
.sel:active{transform:scale(.98)}
.sel.on{box-shadow:inset 0 0 0 2px var(--accent)}
.sel .si{width:44px;height:44px;border-radius:12px;background:var(--fill);color:var(--accent);display:grid;place-items:center;flex:none}
.sel.on .si{background:var(--accent);color:var(--accent-fg)}
.sel b{display:block;font-size:17px}
.sel span{color:var(--fg2);font-size:14px}
.splash{min-height:70vh;display:grid;place-items:center}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:15px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.ring-wrap{width:124px;height:124px}.ring-wrap svg{width:124px;height:124px}.ring-center b{font-size:27px}.hdr h1{font-size:30px}}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
img{max-width:100%}
[hidden]{display:none!important}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanner.live .laser{animation-duration:1.8s}
</style>

const baseTdee = p => bmr(p) * ACT[p.activity][0];
function targets(p) {
  const b = bmr(p), tdee = baseTdee(p) + (p.adaptive ? (p.offset || 0) : 0);
  let delta = p.goal === "lose" ? -(p.rate * 7700 / 7) : p.goal === "gain" ? p.rate * 7700 / 7 : 0;
  let kcal = tdee + delta;
  if (p.goal === "lose") { kcal = Math.max(kcal, Math.max(p.sex === "f" ? 1200 : 1500, b)); delta = kcal - tdee; }
  kcal = Math.round(kcal / 10) * 10;
  const hm = p.height / 100, ref = Math.min(p.weight, 27 * hm * hm);
  const protein = Math.round(ref * { lose: 2, maintain: 1.6, gain: 1.8 }[p.goal]);
  const fat = Math.round(Math.max(kcal * 0.27 / 9, ref * 0.6));
  const carbs = Math.round(Math.max(0, (kcal - protein * 4 - fat * 9) / 4));
  return { kcal, protein, carbs, fat, fiber: Math.round(kcal / 1000 * 14), water: Math.round(p.weight * 0.35) / 10, bmr: Math.round(b), tdee: Math.round(tdee), delta: Math.round(delta) };

function analyze() {
  const today = dayKey(), start = addDays(today, -28);
  const totals = [];
  for (const [k, d] of Object.entries(S.days)) if (k >= start && k < today) { const t = sumItems(d.items).kcal; if (t >= 800) totals.push(t); }
  const ws = S.weights.filter(w => w.d >= start).sort((a, b) => a.d < b.d ? -1 : 1);
  const res = { logged: totals.length, wcount: ws.length, observed: null, weekly: null };
  if (totals.length < 10 || ws.length < 3) return res;

  const xs = ws.map(w => (keyToDate(w.d).getTime() - x0) / 864e5), ys = ws.map(w => w.kg);

// Produktdatenbank: Open Food Facts (DACH), in 240 Teile zerlegt – ein Scan lädt nur ein Teil
const PDB = {
  S: 48, shards: {}, top: null, topList: null,
  idx(code) { return parseInt(code.slice(-5, -1), 10) % this.S; },
  parse(line) { const x = line.split("\t"); return { barcode: x[0], name: x[1], brand: x[2], kcal: +x[3], p: +x[4], c: +x[5], f: +x[6], serving: +x[7] || null, pack: +x[8] || null, src: "off" }; },
  shard(i) {
    if (!this.shards[i]) this.shards[i] = fetch(`db/b${String(i).padStart(3, "0")}.txt`)
      .then(r => { if (!r.ok) throw new Error("http " + r.status); return r.text(); })
      .then(t => { const m = new Map(); for (const l of t.split("\n")) if (l) m.set(l.slice(0, l.indexOf("\t")), l); return m; })
      .catch(e => { delete this.shards[i]; throw e; });
    return this.shards[i];
  },
  async lookup(code) {
    const vs = Array.from(new Set([code, code.replace(/^0+/, ""), "0" + code, code.padStart(13, "0")])).filter(v => v.length >= 8 && v.length <= 14);
    for (const v of vs) { const l = (await this.shard(this.idx(v))).get(v); if (l) return this.parse(l); }
    return null;
  },
  loadTop() {
    if (!this.top) this.top = fetch("db/top.txt").then(r => { if (!r.ok) throw new Error("http " + r.status); return r.text(); })
      .then(t => (this.topList = t.split("\n").filter(Boolean).map(l => { const p = this.parse(l); p.key = (p.name + " " + p.brand).toLowerCase(); return p; })))
      .catch(e => { this.top = null; throw e; });
    return this.top;
  },
  search(q) {
    const toks = q.toLowerCase().split(/\s+/).filter(Boolean), out = [];
    for (const p of this.topList || []) if (toks.every(t => p.key.includes(t))) { out.push(p); if (out.length >= 30) break; }
    return out;
  },
};
async function findProduct(code) {
  for (const v of [code, code.replace(/^0+/, ""), "0" + code]) if (S.products[v]) return { ...S.products[v], barcode: v, src: "mine" };
  return PDB.lookup(code);
}
const SRC_NOTE = { off: "Produktdaten: Open Food Facts", base: "Richtwert", mine: "Aus deinen Produkten" };

function portionPage(prod, meal, src) {
  const units = [];
  if (prod.serving) units.push(["portion", "Portion", prod.serving]);
  if (prod.pack && Math.round(prod.pack) !== Math.round(prod.serving || 0)) units.push(["pack", "Packung", prod.pack]);
  units.push(["g", "Gramm", 1]);
  const st = { unit: units[0][0], amount: units[0][0] === "g" ? 100 : 1, meal };
  const unitG = () => units.find(u => u[0] === st.unit)[2];
  const grams = () => Math.round(st.amount * unitG() * 10) / 10;
  return {
    title: prod.src === "off" || src === "barcode" ? "Produkt" : "Portion",
    mount(el) {
      el.innerHTML = `<div class="prod-head"><h4>${esc(prod.name)}</h4>${prod.brand ? `<span class="muted">${esc(prod.brand)}</span>` : ""}
          ${prod.barcode ? `<span class="badge">${ico("barcode")}${esc(prod.barcode)}</span>` : ""}</div>
        <div class="card" style="display:flex;flex-direction:column;gap:14px">
          ${units.length > 1 ? seg("unit", units.map(u => [u[0], u[0] === "g" ? "Gramm" : `${u[1]} · ${fmt(u[2])} g`]), st.unit) : ""}
          <div class="amount"><button data-d="-1" aria-label="Weniger">−</button><div><input id="pa" inputmode="decimal" value="${fmtIn(st.amount, 2)}" aria-label="Menge"><span id="pu"></span></div><button data-d="1" aria-label="Mehr">+</button></div>
          <div class="muted small" id="pgr" style="text-align:center"></div></div>
        <div><div class="group-h"><span>Mahlzeit</span></div>${seg("meal", MEALS.map(m => [m[0], m[1]]), st.meal)}</div>
        <div class="card"><div style="display:flex;align-items:baseline;gap:6px;margin-bottom:14px"><span class="big-kcal" id="pk"></span><span class="muted" style="font-weight:600">kcal</span></div><div id="pm"></div>
          <p class="footnote" style="padding:12px 0 0">Pro 100 g: ${fmt(prod.kcal)} kcal · Eiweiß ${fmt(prod.p, 1)} g · Kohlenhydrate ${fmt(prod.c, 1)} g · Fett ${fmt(prod.f, 1)} g${SRC_NOTE[prod.src] ? " · " + SRC_NOTE[prod.src] : ""}</p></div>`;
      const upd = () => {
        const g = grams();
        $("#pu", el).textContent = st.unit === "g" ? "g" : (st.amount === 1 ? units.find(u => u[0] === st.unit)[1] : st.unit === "pack" ? "Packungen" : "Portionen");
        $("#pgr", el).textContent = st.unit === "g" ? "" : `= ${fmt(g)} g`;
        $("#pk", el).textContent = fmt(prod.kcal * g / 100);
        $("#pm", el).innerHTML = mtiles(prod.p * g / 100, prod.c * g / 100, prod.f * g / 100);
        Sheet.foot(`<button class="btn btn-primary" id="p-add" ${g > 0 ? "" : "disabled"}>Hinzufügen · ${fmt(prod.kcal * g / 100)} kcal</button>`);
        $("#p-add").onclick = () => {
          addFood({ name: prod.brand && !prod.name.toLowerCase().includes(prod.brand.toLowerCase()) ? `${prod.name} (${prod.brand})` : prod.name, g, kcal: Math.round(prod.kcal * g / 100), p: prod.p * g / 100, c: prod.c * g / 100, f: prod.f * g / 100, meal: st.meal, src, barcode: prod.barcode || null });
          Sheet.close(); toast("Hinzugefügt");
        };
      };
      $("#pa", el).oninput = e => { st.amount = num(e.target.value); upd(); };
      el.querySelector(".amount").onclick = e => {
        const b = e.target.closest("button[data-d]"); if (!b) return;
        const step = st.unit === "g" ? 10 : 0.5;
        st.amount = Math.max(0, Math.round((st.amount + step * +b.dataset.d) * 100) / 100);
        $("#pa", el).value = fmtIn(st.amount, 2); upd();
      };
      bindSeg(el, "unit", v => { st.unit = v; st.amount = v === "g" ? Math.round(grams()) || 100 : 1; $("#pa", el).value = fmtIn(st.amount, 2); upd(); });
      bindSeg(el, "meal", v => st.meal = v);
      upd();
    },
  };
}

function searchPage(meal) {
  let q = "";
  return {
    title: "Lebensmittel",
    mount(el) {
      el.innerHTML = `<input class="field" id="sq" type="search" placeholder="Suchen, z. B. Skyr oder Nutella" value="${esc(q)}" autocomplete="off" aria-label="Suchen"><div id="sres" style="display:flex;flex-direction:column;gap:14px"></div>`;
      let groups = [];
      const draw = () => {
        const ql = q.trim().toLowerCase();
        const rec = recents(), mine = Object.entries(S.products).map(([code, p]) => ({ ...p, barcode: code, src: "mine" }));
        const match = x => !ql || x.name.toLowerCase().includes(ql) || (x.brand || "").toLowerCase().includes(ql);
        const seen = new Set(); const pick = arr => arr.filter(x => { if (!match(x)) return false; const k = (x.name + "|" + (x.brand || "")).toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
        const dbHits = ql.length >= 2 && PDB.topList ? PDB.search(ql).filter(x => { const k = (x.name + "|" + x.brand).toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }) : [];
        groups = [["Zuletzt gegessen", pick(rec).slice(0, ql ? 8 : 12), "search"], ["Meine Produkte", pick(mine).slice(0, 15), "barcode"],
          [ql ? "Lebensmittel (Richtwerte)" : "Häufige Lebensmittel", pick(FOODS.map(f => ({ ...f, src: "base" }))).slice(0, ql ? 12 : 10), "search"], ["Produkte", dbHits, "search"]];
        let h = "";
        if (ql) h += `<div class="list"><button class="row" data-ai="1"><span class="src" style="color:var(--accent)">${ico("spark")}</span><span class="grow"><span class="title">„${esc(q.trim())}“ mit KI schätzen</span><span class="sub">Für Gerichte & Selbstgekochtes, z. B. „2 Spiegeleier mit Toast“</span></span>${ico("right", "chev")}</button></div>`;
        groups.forEach(([title, list], gi) => {
          if (!list.length) return;
          h += `<div><div class="group-h"><span>${title}</span></div><div class="list">${list.map((p, i) => `<button class="row" data-g="${gi}" data-i="${i}"><span class="grow"><span class="title">${esc(p.name)}</span><span class="sub">${p.brand ? esc(p.brand) + " · " : ""}${fmt(p.kcal)} kcal / 100 g${p.serving ? ` · Portion ${fmt(p.serving)} g` : ""}</span></span>${ico("right", "chev")}</button>`).join("")}</div>${gi === 3 ? `<p class="footnote">Produktdaten: Open Food Facts</p>` : ""}</div>`;
        });
        if (ql.length >= 2 && !PDB.topList) h += `<div class="loading"><div class="spin"></div><span>Produktdatenbank wird geladen …</span></div>`;
        else if (ql && !groups.some(g => g[1].length)) h += `<p class="empty">Nichts gefunden. Lass die KI schätzen oder trage es manuell ein.</p>`;
        h += `<div class="list"><button class="row add-row" data-man="1">${ico("pencil")}<span class="grow">Manuell eintragen</span></button></div>`;
        $("#sres", el).innerHTML = h;
      };
      $("#sres", el).onclick = e => {
        const b = e.target.closest("button"); if (!b) return;
        if (b.dataset.ai) return Sheet.push(textAiPage(q.trim(), meal));
        if (b.dataset.man) return Sheet.push(entryPage(null, meal, { name: q.trim() }));
        const g = groups[+b.dataset.g]; if (!g) return;
        Sheet.push(portionPage(g[1][+b.dataset.i], meal, g[2]));
      };
      $("#sq", el).oninput = e => {
        q = e.target.value; draw();
        if (q.trim().length >= 2 && !PDB.topList) PDB.loadTop().then(() => { if ($("#sres", el)) draw(); }).catch(() => { });
      };
      draw();

// Barcode: Foto des Strichcodes → eigene Produktdatenbank → sonst Nährwerttabelle per KI lesen
async function decodeBarcode(file) {
  const Z = window.ZXing; if (!Z) return null;
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const reader = new Z.MultiFormatReader(); reader.setHints(hints);
    for (const max of [1200, 800, 1800]) for (const rot of [0, 90]) {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      const c = document.createElement("canvas"); c.width = rot ? h : w; c.height = rot ? w : h;
      const ctx = c.getContext("2d");
      if (rot) { ctx.translate(h, 0); ctx.rotate(Math.PI / 2); }
      ctx.drawImage(img, 0, 0, w, h);
      try { const r = reader.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))); if (r) return r.getText(); } catch (e) { }
    }
    return null;
  } catch (e) { return null; } finally { URL.revokeObjectURL(url); }
}

        if (t.id === "wo-min") { w.min = num(t.value); const k = $("#wo-kcal", el); if (k) k.placeholder = "≈ " + estKcal(); }
        if (t.id === "wo-kcal") w.kcal = num(t.value);
        if (t.id === "wo-note") w.note = t.value;
        if (t.id === "wo-date" && t.value) w.date = new Date(t.value).toISOString();
      };
    },
  };
  function elapsed() { const s = Math.max(0, Math.floor((Date.now() - new Date(w.date).getTime()) / 1000)); return `${Math.floor(s / 3600)}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; }
  function drawEx() {
    const box = $("#wo-ex", el); if (!box) return;
    box.innerHTML = w.ex.map((e, x) => {
      const last = lastSets(e.name, w.id);
      return `<div class="list"><div class="ex-head"><b>${esc(e.name)}</b><button class="icon-btn" data-a="rmex" data-x="${x}" aria-label="Übung entfernen">${ico("trash")}</button></div>
        ${e.sets.map((s, si) => `<div class="set-row"><span class="set-no">${si + 1}</span>
          <input class="set-w" data-w="${x}-${si}" inputmode="decimal" value="${fmtIn(s.w, 2)}" placeholder="0" aria-label="Gewicht in kg"><span class="muted">kg</span>
          <span style="flex:1"></span>
          <span class="stepper"><button data-a="rep" data-x="${x}" data-s="${si}" data-d="-1" aria-label="Weniger Wiederholungen">−</button><b id="r-${x}-${si}" class="num" style="min-width:28px;text-align:center">${s.r}</b><button data-a="rep" data-x="${x}" data-s="${si}" data-d="1" aria-label="Mehr Wiederholungen">+</button></span>
          <span class="muted small">Wdh.</span>
          <button class="icon-btn" data-a="rmset" data-x="${x}" data-s="${si}" aria-label="Satz löschen">${ico("trash")}</button></div>`).join("")}
        <button class="row add-row" data-a="addset" data-x="${x}">${ico("plus")}<span class="grow">Satz hinzufügen</span></button>
        ${last ? `<div class="ex-foot">Letztes Mal: ${last.map(s => `${fmtIn(s.w, 2) || 0} kg × ${s.r}`).join(", ")}</div>` : ""}</div>`;
    }).join("") + `<button class="btn btn-tinted" data-a="addex">${ico("plusc")}Übung hinzufügen</button>`;
  }
  function draw() {
    el.innerHTML = `${isNew ? `<div class="timer"><b id="wo-t" style="color:var(${WT[w.type][4]})">${elapsed()}</b><span>${esc(WT[w.type][0])} läuft</span></div>` : ""}
      ${w.type === "strength" ? `<div id="wo-ex" style="display:flex;flex-direction:column;gap:14px"></div>` : ""}
      <div><div class="group-h"><span>Details</span></div><div class="list">
        <div class="frow"><label for="wo-date">Start</label><input type="datetime-local" id="wo-date" value="${localDT(w.date)}"></div>
        <div class="frow"><label for="wo-min">Dauer</label><input class="inline" id="wo-min" inputmode="numeric" value="${w.min > 0 ? fmtIn(w.min, 0) : ""}" placeholder="${isNew ? "Timer" : "0"}"><span class="unit">min</span></div>
        <div class="frow"><label for="wo-kcal">Kalorien</label><input class="inline" id="wo-kcal" inputmode="numeric" value="${w.kcal > 0 ? fmtIn(w.kcal, 0) : ""}" placeholder="≈ ${estKcal()}"><span class="unit">kcal</span></div>
        <div class="frow"><input class="field" style="background:none;padding:4px 0" id="wo-note" placeholder="Notiz" value="${esc(w.note)}" aria-label="Notiz"></div>
      </div><p class="footnote">Leere Felder werden automatisch gefüllt: Dauer über den Timer, Kalorien über dein Gewicht und die Sportart.</p></div>
      ${isNew ? "" : `<button class="btn btn-danger" data-a="del">${ico("trash")}Training löschen</button>`}`;
    drawEx();
  }
  return page;
}
function exercisePickerPage(onPick) {
  let q = "";
  return {
    title: "Übung wählen",
    mount(el) {
      const used = []; S.workouts.slice().sort((a, b) => a.date < b.date ? 1 : -1).forEach(w => (w.ex || []).forEach(e => { if (!used.includes(e.name)) used.push(e.name); }));
      el.innerHTML = `<input class="field" id="xq" type="search" placeholder="Übung suchen oder neu anlegen" autocomplete="off" aria-label="Übung suchen"><div id="xl" style="display:flex;flex-direction:column;gap:14px"></div>`;
      const draw = () => {
        const ql = q.trim().toLowerCase();
        const all = Array.from(new Set(EXERCISES.concat(used))).sort((a, b) => a.localeCompare(b, "de"));
        const list = all.filter(n => !ql || n.toLowerCase().includes(ql));
        const exact = all.some(n => n.toLowerCase() === ql);
        let h = "";
        if (ql && !exact) h += `<div class="list"><button class="row add-row" data-n="${esc(q.trim())}">${ico("plusc")}<span class="grow">„${esc(q.trim())}“ hinzufügen</span></button></div>`;
        if (!ql && used.length) h += `<div><div class="group-h"><span>Zuletzt</span></div><div class="list">${used.slice(0, 6).map(n => `<button class="row" data-n="${esc(n)}"><span class="grow">${esc(n)}</span></button>`).join("")}</div></div>`;
        if (list.length) h += `<div><div class="group-h"><span>Alle Übungen</span></div><div class="list">${list.map(n => `<button class="row" data-n="${esc(n)}"><span class="grow">${esc(n)}</span></button>`).join("")}</div></div>`;
        $("#xl", el).innerHTML = h;
      };
      $("#xq", el).oninput = e => { q = e.target.value; draw(); };
      $("#xl", el).onclick = e => { const b = e.target.closest("[data-n]"); if (!b) return; onPick(b.dataset.n); Sheet.back(); };
      draw();
    },
  };
}

function copyForHealth(payload, shortcutName) {
  const text = JSON.stringify(payload);
  try { navigator.clipboard.writeText(text).catch(() => { }); } catch (e) { }
  location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(shortcutName) + "&input=text&text=" + encodeURIComponent(text);
}

function render() {
  const v = $("#view"), tb = $("#tabbar");
  v.oninput = v.onchange = null;
  if (!S.ready && !S.profile) { tb.hidden = true; v.innerHTML = `<div class="splash"><div class="spin"></div></div>`; return; }
  if (!S.profile) { tb.hidden = true; v.innerHTML = viewOnboarding(); mountOnboarding(); return; }
  tb.hidden = false;
  $$("#tabbar button").forEach(b => b.classList.toggle("on", b.dataset.arg === S.tab));
  v.innerHTML = { today: viewToday, training: viewTraining, progress: viewProgress, profile: viewProfile }[S.tab]();
  if (S.tab === "profile") mountProfile();
  if (S.tab === "progress") { bindSeg(v, "range", x => { S.range = +x; render(); }); const sel = $("#ex-sel"); if (sel) sel.onchange = e => { S.exercise = e.target.value; render(); }; }
}

function viewToday() {
  const p = S.profile, t = targets(p), k = S.day, d = S.days[k] || { items: [], health: false };
  const tot = sumItems(d.items), rem = t.kcal - tot.kcal, isToday = k === dayKey();

  const title = isToday ? "Heute" : k === addDays(dayKey(), -1) ? "Gestern" : dt.toLocaleDateString("de-DE", { weekday: "long" });

    const items = d.items.filter(x => x.meal === m), sum = items.reduce((a, x) => a + x.kcal, 0);
    return `<div><div class="group-h"><span>${ico(icon)}${label}</span>${items.length ? `<span class="num">${fmt(sum)} kcal</span>` : ""}</div><div class="list">

        <span class="grow"><span class="title">${esc(x.name)}</span><span class="sub">${fmt(x.g)} g · ${macroDots(x.p, x.c, x.f)}</span></span><span class="end">${fmt(x.kcal)}<small>kcal</small></span></button>`).join("")}

    <section class="card summary">
      <div class="sum-top">
        <div class="ring-wrap">${ring(t.kcal ? tot.kcal / t.kcal : 0)}<div class="ring-center"><b>${fmt(Math.abs(rem))}</b><span>${rem >= 0 ? "kcal übrig" : "kcal zu viel"}</span></div></div>
        <div class="sum-lines">
          <div class="sline" style="color:var(--fg2)">${ico("target")}<div><small>Ziel</small><b style="color:var(--fg)">${fmt(t.kcal)} kcal</b></div></div>

function viewTraining() {
  const today = dayKey(), wd = (new Date().getDay() + 6) % 7, start = addDays(today, -wd);
  const ws = S.workouts.slice().sort((a, b) => a.date < b.date ? 1 : -1);
  const week = ws.filter(w => dayKey(new Date(w.date)) >= start);
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  const trained = new Set(ws.map(w => dayKey(new Date(w.date))));
  return `<header class="hdr"><div><p class="eyebrow">Diese Woche ${week.length} ${week.length === 1 ? "Training" : "Trainings"}</p><h1>Training</h1></div></header>
    <section class="card">
      <div class="stats">${stat(week.length, "", "Trainings")}${stat(fmt(week.reduce((a, w) => a + w.min, 0)), "min", "Dauer")}${stat(fmt(week.reduce((a, w) => a + woVolume(w), 0) / 1000, 1), "t", "Bewegtes Gewicht")}${stat(fmt(week.reduce((a, w) => a + w.kcal, 0)), "kcal", "Verbrannt")}</div>
      <div class="week">${days.map(k => `<div><small>${keyToDate(k).toLocaleDateString("de-DE", { weekday: "narrow" })}</small><i class="${trained.has(k) ? "on" : ""} ${k === today ? "today" : ""}">${trained.has(k) ? ico("check") : ""}</i></div>`).join("")}</div>
    </section>

    <div class="wgrid">${Object.entries(WT).map(([k, v]) => `<button class="wtile" data-act="startWo" data-arg="${k}"><span style="color:var(${v[4]})">${ico(v[3])}</span>${v[1]}</button>`).join("")}</div>
    <h2 class="section-title">Verlauf</h2>
    ${ws.length ? `<div class="list">${ws.slice(0, 60).map(w => { const v = WT[w.type] || WT.other; const sets = (w.ex || []).reduce((a, e) => a + e.sets.length, 0), vol = woVolume(w);
      return `<button class="row" data-act="editWo" data-arg="${w.id}"><span class="wicon" style="color:var(${v[4]});background:color-mix(in srgb, var(${v[4]}) 15%, transparent)">${ico(v[3])}</span>
        <span class="grow"><span class="title" style="font-weight:600">${v[0]}</span><span class="sub">${fmt(w.min)} min${w.type === "strength" ? ` · ${sets} Sätze${vol ? ` · ${fmt(vol / 1000, 1)} t` : ""}` : ""} · ${fmt(w.kcal)} kcal</span></span>
        <span class="muted small">${new Date(w.date).toLocaleDateString("de-DE", { day: "numeric", month: "short" })}</span></button>`; }).join("")}</div>`
      : `<div class="card empty">Noch keine Trainings. Tippe oben auf eine Sportart, um dein erstes zu starten.</div>`}`;
}

function viewProgress() {
  const p = S.profile, t = targets(p), range = S.range, start = addDays(dayKey(), -(range - 1));
  // Gewicht
  const allW = S.weights, wIn = allW.filter(w => w.d >= start);
  const first = allW[0] ? allW[0].kg : p.weight;
  const goalProg = Math.abs(first - p.target) < 0.05 ? (p.goal === "maintain" ? 1 : 0) : clamp((first - p.weight) / (first - p.target), 0, 1);
  const change = wIn.length > 1 ? wIn[wIn.length - 1].kg - wIn[0].kg : null;
  const good = change == null ? null : p.goal === "lose" ? change <= 0 : p.goal === "gain" ? change >= 0 : Math.abs(change) < 1;
  const b = bmi(p), bl = b < 18.5 ? "Untergewicht" : b < 25 ? "Normalgewicht" : b < 30 ? "Übergewicht" : "Adipositas";
  // Kalorien
  const perDay = {}; Object.entries(S.days).forEach(([k, d]) => { if (k >= start && k <= dayKey()) { const s = sumItems(d.items).kcal; if (s > 0) perDay[k] = s; } });
  let kpts = [];
  if (range <= 30) { for (let i = 0; i < range; i++) { const k = addDays(start, i); kpts.push({ y: perDay[k] || 0, label: keyToDate(k).toLocaleDateString("de-DE", { day: "numeric", month: "short" }) }); } }
  else { const wk = {}; Object.entries(perDay).forEach(([k, v]) => { const d = keyToDate(k); const mon = addDays(k, -((d.getDay() + 6) % 7)); (wk[mon] = wk[mon] || []).push(v); }); kpts = Object.keys(wk).sort().map(k => ({ y: wk[k].reduce((a, b) => a + b) / wk[k].length, label: keyToDate(k).toLocaleDateString("de-DE", { day: "numeric", month: "short" }) })); }
  const logged = Object.values(perDay), avg = logged.length ? logged.reduce((a, b) => a + b) / logged.length : 0;
  // Training pro Woche
  const today = dayKey(), monday = addDays(today, -((new Date().getDay() + 6) % 7));
  const nW = Math.min(52, Math.max(8, Math.round(range / 7)));
  const tpts = Array.from({ length: nW }, (_, i) => { const s = addDays(monday, -7 * (nW - 1 - i)), e = addDays(s, 7); return { y: S.workouts.filter(w => { const k = dayKey(new Date(w.date)); return k >= s && k < e; }).reduce((a, w) => a + w.min, 0), label: keyToDate(s).toLocaleDateString("de-DE", { day: "numeric", month: "short" }) }; });
  const wIn2 = S.workouts.filter(w => dayKey(new Date(w.date)) >= start);
  // Kraft
  const counts = {}; S.workouts.forEach(w => (w.ex || []).forEach(e => { if (e.sets.length) counts[e.name] = (counts[e.name] || 0) + 1; }));
  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const ex = names.includes(S.exercise) ? S.exercise : names[0];
  const spts = ex ? wIn2.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(w => { const e = (w.ex || []).find(z => z.name === ex); const v = e ? Math.max(0, ...e.sets.map(oneRM)) : 0; return v ? { x: new Date(w.date).getTime(), y: Math.round(v * 10) / 10 } : null; }).filter(Boolean) : [];
  const bestW = ex ? Math.max(0, ...wIn2.flatMap(w => (w.ex || []).filter(e => e.name === ex).flatMap(e => e.sets.filter(s => s.r > 0).map(s => s.w)))) : 0;
  const impr = spts.length > 1 && spts[0].y ? (spts[spts.length - 1].y - spts[0].y) / spts[0].y * 100 : null;

  return `<header class="hdr"><div><p class="eyebrow">Dein Verlauf</p><h1>Fortschritt</h1></div></header>
    ${seg("range", [[7, "7 T"], [30, "30 T"], [90, "90 T"], [365, "1 J"]], range)}
    <section class="card"><div class="card-h"><h2>${ico("target")}Ziel: ${GOALS[p.goal][0]}</h2><b class="num" style="color:var(--accent)">${Math.round(goalProg * 100)} %</b></div>
      <div class="progress"><i style="width:${goalProg * 100}%"></i></div>
      <div class="stats">${stat(fmt(p.weight, 1), "kg", "Aktuell")}${stat(fmt(Math.abs(p.weight - p.target), 1), "kg", "Bis zum Ziel")}${stat(fmt(b, 1), "", "BMI · " + bl)}</div></section>
    <section class="card"><div class="card-h"><h2>${ico("scale")}Gewicht</h2><button class="pill-btn" data-act="logWeight">Eintragen</button></div>
      <div class="stats">${stat(fmt(wIn.length ? wIn[wIn.length - 1].kg : p.weight, 1), "kg", "Aktuell")}${change != null ? stat((change > 0 ? "+" : "") + fmt(change, 1), "kg", "Veränderung", good ? "--green" : "--orange") : ""}${stat(fmt(p.target, 1), "kg", "Ziel")}</div>
      ${wIn.length >= 2 ? lineChart(wIn.map(w => ({ x: keyToDate(w.d).getTime(), y: w.kg })), { target: p.target, digits: 1, color: "--accent", label: "Gewichtsverlauf" }) : `<p class="muted small" style="margin:12px 0 0">Trage regelmäßig dein Gewicht ein, am besten morgens. Ab zwei Einträgen im Zeitraum siehst du hier deine Kurve.</p>`}</section>
    <section class="card"><div class="card-h"><h2>${ico("flame")}Kalorien</h2></div>
      <div class="stats">${stat(fmt(avg), "kcal", "Ø pro protokolliertem Tag")}${stat(fmt(t.kcal), "kcal", "Tagesziel")}${stat(logged.length, "", "Tage erfasst")}</div>
      ${logged.length ? barChart(kpts, { target: t.kcal, label: "Kalorien pro " + (range <= 30 ? "Tag" : "Woche") }) : `<p class="muted small" style="margin:12px 0 0">Noch keine Mahlzeiten in diesem Zeitraum.</p>`}</section>
    <section class="card"><div class="card-h"><h2>${ico("run")}Training</h2></div>
      <div class="stats">${stat(wIn2.length, "", "Trainings")}${stat(fmt(wIn2.reduce((a, w) => a + w.min, 0)), "min", "Gesamtdauer")}${stat(fmt(wIn2.reduce((a, w) => a + woVolume(w), 0) / 1000, 1), "t", "Volumen")}</div>
      ${barChart(tpts, { color: "--orange", label: "Trainingsminuten pro Woche" })}<p class="footnote" style="padding:4px 0 0">Minuten pro Woche</p></section>
    <section class="card"><div class="card-h"><h2>${ico("dumbbell")}Kraft</h2>${names.length ? `<select id="ex-sel" class="field" style="width:auto;padding:7px 10px" aria-label="Übung">${names.map(n => `<option ${n === ex ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>` : ""}</div>
      ${names.length ? `<div class="stats">${stat(fmt(spts.length ? Math.max(...spts.map(s => s.y)) : 0, 1), "kg", "Bestes 1RM (geschätzt)")}${stat(fmt(bestW, 1), "kg", "Höchstes Gewicht")}${impr != null ? stat((impr >= 0 ? "+" : "") + fmt(impr), "%", "Fortschritt", impr >= 0 ? "--green" : "--orange") : ""}</div>
        ${spts.length >= 2 ? lineChart(spts, { color: "--orange", digits: 0, label: "Kraftentwicklung " + ex }) : `<p class="muted small" style="margin:12px 0 0">Ab zwei Trainings mit dieser Übung im Zeitraum siehst du hier eine Kurve.</p>`}`
      : `<p class="muted small" style="margin:0">Logge Krafttrainings mit Sätzen und Gewichten, dann siehst du hier deine Kraftentwicklung pro Übung.</p>`}</section>`;
}

      ${rates.length ? `<div class="frow"><label for="pf-rate">Tempo</label><select id="pf-rate">${rates.map(r => `<option value="${r}" ${r === p.rate ? "selected" : ""}>${fmt(r, 2)} kg pro Woche</option>`).join("")}</select></div>` : ""}
    </div></div>
    <div><div class="group-h"><span>Intelligente Anpassung</span></div><div class="list">
      <div class="frow"><span class="lbl">Ziel automatisch anpassen</span>${toggle("pf-adapt", p.adaptive)}</div>
      ${p.adaptive ? (a.observed != null ? `<div class="frow"><span class="lbl">Gemessener Verbrauch</span><b class="num">${fmt(a.observed)} kcal</b></div><div class="frow"><span class="lbl">Trend</span><b class="num">${a.weekly >= 0 ? "+" : ""}${fmt(a.weekly, 2)} kg / Woche</b></div>`
        : `<div class="frow" style="flex-direction:column;align-items:stretch;gap:6px"><span>Lernt deinen Stoffwechsel kennen …</span><div class="progress" style="margin:2px 0"><i style="width:${Math.min(a.logged, 10) * 10}%"></i></div><span class="muted small">${a.logged}/10 protokollierte Tage · ${a.wcount}/3 Gewichtseinträge (letzte 4 Wochen)</span></div>`) : ""}
      ${p.adaptive && p.offset ? `<div class="frow"><span class="lbl">Aktuelle Korrektur</span><b class="num">${p.offset > 0 ? "+" : ""}${fmt(p.offset)} kcal</b></div><button class="row" style="color:var(--red)" data-act="resetAdapt"><span class="grow">Korrektur zurücksetzen</span></button>` : ""}
    </div><p class="footnote">FitTrack vergleicht, was du isst, mit deinem Gewichtsverlauf und passt dein Kalorienziel an deinen echten Verbrauch an. Neue Körperwerte werden sofort eingerechnet.</p></div>
    <div><div class="group-h"><span>Apple Health</span></div><div class="list">
      <div class="frow"><span class="lbl">Über Kurzbefehle senden</span>${toggle("pf-health", p.healthBridge)}</div></div>
      <p class="footnote">Web-Apps können nicht direkt auf Apple Health zugreifen. Mit zwei kleinen Kurzbefehlen schickst du Tagessumme und Gewicht trotzdem mit einem Tipp an Health.</p></div>
    ${p.healthBridge ? `<details class="help" open><summary>Kurzbefehle einrichten (einmalig, 3 Minuten)</summary>
      <p style="margin:10px 0 4px"><b>1. „FitTrack Ernährung“</b></p><ol>
        <li>App <b>Kurzbefehle</b> öffnen › <b>+</b> › Name <code>FitTrack Ernährung</code>.</li>
        <li>Aktion <b>Wörterbuch abrufen</b> hinzufügen, als Eingabe <b>Kurzbefehleingabe</b> wählen.</li>
        <li>4× <b>Wörterbuchwert abrufen</b> mit den Schlüsseln <code>kcal</code>, <code>protein</code>, <code>carbs</code>, <code>fat</code>, jeweils gefolgt von <b>Health-Sample protokollieren</b>: Nahrungsenergie (kcal), Protein (g), Kohlenhydrate (g), Fett gesamt (g).</li></ol>
      <p style="margin:12px 0 4px"><b>2. „FitTrack Gewicht“</b></p><ol>
        <li><b>Wörterbuch abrufen</b> mit <b>Kurzbefehleingabe</b> › <b>Wörterbuchwert abrufen</b> für <code>kg</code>.</li>
        <li><b>Health-Sample protokollieren</b>: Gewicht (kg).</li></ol>
      <p class="muted" style="margin:12px 0 0">So nutzt du es: In „Heute“ auf <b>Senden</b> tippen. FitTrack startet den Kurzbefehl mit der Tagessumme, die Werte landen direkt in Health. Sende jeden Tag nur einmal, sonst zählt Health doppelt.</p></details>` : ""}
    <div><div class="group-h"><span>KI-Erkennung</span></div><div class="list">
      ${AI.key() ? `<div class="frow"><span class="lbl"><span style="color:var(--green)">●</span> API-Key gespeichert</span></div><button class="row" style="color:var(--red)" data-act="removeKey"><span class="grow">API-Key entfernen</span></button>`
        : `<button class="row add-row" data-act="setKey">${ico("spark")}<span class="grow">API-Key eintragen</span>${ico("right", "chev")}</button>`}</div>
      <p class="footnote">Fotos und Beschreibungen gehen zur Analyse an Claude (Anthropic). Der Key bleibt nur auf diesem iPhone. Alles andere funktioniert ohne Key und ohne Internet.</p></div>
    <div><div class="group-h"><span>Daten</span></div><div class="list"><div class="frow"><span class="lbl">Speicherort</span><span class="muted">Auf diesem iPhone</span></div>
      <div class="frow"><span class="lbl">Produktdatenbank offline</span><span class="muted num" id="offline-status">…</span></div>
      <button class="row" data-act="exportData"><span class="grow" style="color:var(--accent)">Backup exportieren</span>${ico("right", "chev")}</button>
      <label class="row" style="color:var(--accent);cursor:pointer"><span class="grow">Daten importieren</span><input type="file" id="imp-file" accept="application/json,.json" hidden>${ico("right", "chev")}</label>
      <button class="row" style="color:var(--red)" data-act="wipe" id="wipe"><span class="grow">Alle Daten löschen</span></button></div>
      <p class="footnote">Deine Daten liegen nur auf diesem iPhone. Exportiere ab und zu ein Backup, zum Beispiel in iCloud Drive.</p></div>`;
}
function targetsCard(t, p) {
  return `<span class="muted small" style="font-weight:600">Dein Tagesziel</span>
    <div style="display:flex;align-items:baseline;gap:6px;margin:2px 0 14px"><span class="big-kcal">${fmt(t.kcal)}</span><span class="muted" style="font-weight:600">kcal</span></div>
    ${mtiles(t.protein, t.carbs, t.fat)}
    <div class="info-lines"><div><span>Grundumsatz</span><span>${fmt(t.bmr)} kcal</span></div><div><span>Gesamtverbrauch</span><span>${fmt(t.tdee)} kcal</span></div>
      ${t.delta ? `<div><span>${t.delta < 0 ? "Tägliches Defizit" : "Täglicher Überschuss"}</span><span>${fmt(Math.abs(t.delta))} kcal</span></div>` : ""}
      <div><span>Wasser</span><span>${fmt(t.water, 1)} l</span></div><div><span>Ballaststoffe</span><span>${fmt(t.fiber)} g</span></div><div><span>Alter</span><span>${age(p.birth)} Jahre</span></div></div>`;
}
function mountProfile() {
  const v = $("#view"), p = S.profile;
  const refresh = () => { $("#tcard").innerHTML = targetsCard(targets(p), p); Store.profile(); };
  bindSeg(v, "sex", x => { p.sex = x; refresh(); });
  v.oninput = e => { const k = e.target.dataset.k; if (k) { const n = num(e.target.value); if (n > 0) { p[k] = n; refresh(); } } };
  v.onchange = e => {
    const id = e.target.id;
    if (id === "pf-birth" && e.target.value) { p.birth = e.target.value; refresh(); }
    if (id === "pf-act") { p.activity = e.target.value; refresh(); }
    if (id === "pf-goal") { p.goal = e.target.value; const r = GOALS[p.goal][2]; if (r.length && !r.includes(p.rate)) p.rate = r.includes(0.5) ? 0.5 : r[0]; Store.profile(); render(); }
    if (id === "pf-rate") { p.rate = num(e.target.value); refresh(); }
    if (id === "pf-adapt") { p.adaptive = e.target.checked; Store.profile(); render(); }
    if (id === "pf-health") { p.healthBridge = e.target.checked; Store.profile(); render(); }
    if (id === "imp-file" && e.target.files && e.target.files[0]) importData(e.target.files[0]);
  };
  OfflineDB.ui();
}

// ---------- Onboarding ----------
function obDefaults() { const b = new Date(); b.setFullYear(b.getFullYear() - 30); return { step: 0, sex: "m", birth: dayKey(b), height: 178, weight: 80, activity: "moderate", goal: "lose", rate: 0.5, target: 75 }; }
function viewOnboarding() {
  const o = S.ob || (S.ob = obDefaults()), last = 4;
  const nav = o.step ? `<div class="ob-top"><button class="circle-btn" data-act="obBack" aria-label="Zurück">${ico("left")}</button><div class="progress"><i style="width:${o.step / last * 100}%"></i></div></div>` : "";
  let body = "";
  if (o.step === 0) body = `<div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-top:18px">
      <div class="ring-wrap" style="width:96px;height:96px">${ring(0.72, 96, 12)}<div class="ring-center" style="color:var(--kcal1)">${ico("fork", "", 'style="width:34px;height:34px"')}</div></div>
      <h1>Willkommen bei FitTrack</h1><p class="lead">Ernährung und Training, ganz einfach im Blick.</p></div>
    <div style="display:flex;flex-direction:column;gap:20px;margin-top:10px">
      <div class="feat"><span style="color:var(--green)">${ico("camera")}</span><div><b>Foto-Erkennung</b><span>Essen fotografieren, die KI erkennt Kalorien und Nährstoffe.</span></div></div>
      <div class="feat"><span style="color:var(--blue)">${ico("barcode")}</span><div><b>Barcode</b><span>Verpackte Produkte scannen und mit einem Tipp wieder eintragen.</span></div></div>
      <div class="feat"><span style="color:var(--orange)">${ico("dumbbell")}</span><div><b>Training & Fortschritt</b><span>Sätze, Gewichte, Kraftkurven und Gewichtsverlauf.</span></div></div>
      <div class="feat"><span style="color:var(--pink)">${ico("heart")}</span><div><b>Passt sich an</b><span>Dein Kalorienziel lernt aus deinem echten Verlauf.</span></div></div></div>`;
  if (o.step === 1) body = `<div><h1>Deine Körperwerte</h1><p class="lead">Daraus berechnen wir deinen Kalorien- und Nährstoffbedarf.</p></div>
    ${seg("ob-sex", [["m", "Männlich"], ["f", "Weiblich"]], o.sex)}
    <div class="list">
      <div class="frow"><label for="ob-birth">Geburtstag</label><input type="date" id="ob-birth" value="${o.birth}" max="${dayKey()}"></div>
      <div class="frow"><label for="ob-height">Größe</label><input class="inline" id="ob-height" data-k="height" inputmode="decimal" value="${fmtIn(o.height, 0)}" style="font-size:20px;font-weight:600"><span class="unit">cm</span></div>
      <div class="frow"><label for="ob-weight">Gewicht</label><input class="inline" id="ob-weight" data-k="weight" inputmode="decimal" value="${fmtIn(o.weight, 1)}" style="font-size:20px;font-weight:600"><span class="unit">kg</span></div></div>`;
  if (o.step === 2) body = `<div><h1>Wie aktiv bist du?</h1><p class="lead">Dein Alltag inklusive Training.</p></div>
    <div style="display:flex;flex-direction:column;gap:10px">${Object.entries(ACT).map(([k, v]) => `<button class="sel ${o.activity === k ? "on" : ""}" data-act="obSet" data-arg="activity:${k}"><span class="si">${ico(v[3])}</span><span><b>${v[1]}</b><span>${v[2]}</span></span></button>`).join("")}</div>`;
  if (o.step === 3) body = `<div><h1>Was ist dein Ziel?</h1><p class="lead">Du kannst es jederzeit im Profil ändern.</p></div>
    <div style="display:flex;flex-direction:column;gap:10px">${Object.entries(GOALS).map(([k, v]) => `<button class="sel ${o.goal === k ? "on" : ""}" data-act="obSet" data-arg="goal:${k}"><span class="si">${ico(v[3])}</span><span><b>${v[0]}</b><span>${v[1]}</span></span></button>`).join("")}</div>
    ${o.goal !== "maintain" ? `<div><div class="group-h"><span>Tempo pro Woche</span></div>${seg("ob-rate", GOALS[o.goal][2].map(r => [r, fmt(r, 2) + " kg"]), o.rate)}</div>
      <div class="list"><div class="frow"><label for="ob-target">Zielgewicht</label><input class="inline" id="ob-target" data-k="target" inputmode="decimal" value="${fmtIn(o.target, 1)}" style="font-size:20px;font-weight:600"><span class="unit">kg</span></div></div>` : ""}`;
  if (o.step === 4) {
    const t = targets({ ...o, adaptive: false, offset: 0 });
    body = `<div><h1>Dein persönlicher Plan</h1><p class="lead">Passt sich automatisch an deinen Fortschritt an.</p></div>
      <section class="card" style="text-align:center"><div class="big-kcal" style="font-size:64px">${fmt(t.kcal)}</div><div class="muted" style="font-weight:600;margin:4px 0 16px">kcal pro Tag</div>${mtiles(t.protein, t.carbs, t.fat)}</section>
      <section class="card"><div class="info-lines" style="margin:0;padding:0;border:0"><div><span>Grundumsatz</span><span>${fmt(t.bmr)} kcal</span></div><div><span>Gesamtverbrauch</span><span>${fmt(t.tdee)} kcal</span></div>
        ${t.delta ? `<div><span>${t.delta < 0 ? "Tägliches Defizit" : "Täglicher Überschuss"}</span><span>${fmt(Math.abs(t.delta))} kcal</span></div>` : ""}<div><span>Wasser</span><span>${fmt(t.water, 1)} l</span></div><div><span>Ballaststoffe</span><span>${fmt(t.fiber)} g</span></div></div></section>`;
  }
  return `<div class="ob">${nav}${body}<div style="flex:1"></div><button class="btn btn-primary" data-act="obNext">${o.step === last ? "Los geht's" : "Weiter"}</button></div>`;
}
function mountOnboarding() {
  const v = $("#view"), o = S.ob;
  bindSeg(v, "ob-sex", x => o.sex = x);
  bindSeg(v, "ob-rate", x => o.rate = num(x));
  v.oninput = e => { const k = e.target.dataset.k; if (k) { const n = num(e.target.value); if (n > 0) o[k] = n; } };
  v.onchange = e => { if (e.target.id === "ob-birth" && e.target.value) o.birth = e.target.value; };
}

// ---------- Aktionen ----------
const A = {
  tab(x) { S.tab = x; render(); window.scrollTo(0, 0); },
  day(x) { const n = addDays(S.day, +x); if (n <= dayKey()) { S.day = n; render(); } },
  addPhoto() { if (AI.key()) Sheet.open(photoPage(currentMeal(), true)); else Sheet.open(keyPage(() => Sheet.replace(photoPage(currentMeal(), true)))); },
  addBarcode() { Sheet.open(scanPage(currentMeal())); },
  addSearch(m) { Sheet.open(searchPage(m || currentMeal())); setTimeout(() => { const q = $("#sq"); if (q && !m) q.focus(); }, 350); },
  editFood(id) { const it = (S.days[S.day] || { items: [] }).items.find(x => x.id === id); if (it) Sheet.open(entryPage({ key: S.day, item: it })); },
  sendHealth() {
    const d = S.days[S.day]; if (!d) return; const t = sumItems(d.items);
    copyForHealth({ kcal: Math.round(t.kcal), protein: Math.round(t.p), carbs: Math.round(t.c), fat: Math.round(t.f) }, "FitTrack Ernährung");
    d.health = true; Store.day(S.day); render();
  },
  logWeight() { Sheet.open(weightPage()); },
  startWo(type) { Sheet.open(workoutPage(null, type)); },
  editWo(id) { const w = S.workouts.find(x => x.id === id); if (w) Sheet.open(workoutPage(w)); },
  setKey() { Sheet.open(keyPage(() => { Sheet.close(); })); },
  removeKey(_, el) { if (!el.dataset.sure) { el.dataset.sure = "1"; el.querySelector(".grow").textContent = "Wirklich entfernen? Nochmal tippen"; return; } AI.setKey(""); render(); },
  async exportData() {
    const json = JSON.stringify({ app: "fittrack", version: 1, exported: new Date().toISOString(), ...dataSnapshot() });
    const name = `fittrack-backup-${dayKey()}.json`;
    const file = new File([json], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "FitTrack-Backup" }); return; } catch (e) { if (e && e.name === "AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  },
  resetAdapt() { S.profile.offset = 0; S.profile.lastAdapt = null; Store.profile(); render(); },
  wipe(_, el) {
    if (!el.dataset.sure) { el.dataset.sure = "1"; el.querySelector(".grow").textContent = "Wirklich alles löschen? Nochmal tippen"; return; }
    const days = Object.keys(S.days), wos = S.workouts.map(w => w.id);
    S.days = {}; S.workouts = []; S.weights = []; S.products = {};
    days.forEach(k => Store.day(k)); wos.forEach(id => Store.workout(id)); Store.weights(); Store.products();
    S.profile = null; S.ob = null; saveLocal();
    Store.save(true);
    render();
  },
  obBack() { S.ob.step = Math.max(0, S.ob.step - 1); render(); },
  obSet(x) {
    const [k, val] = x.split(":"); S.ob[k] = val;
    if (k === "goal") { const r = GOALS[val][2]; if (r.length && !r.includes(S.ob.rate)) S.ob.rate = 0.5; S.ob.target = val === "lose" ? Math.round(S.ob.weight - 5) : val === "gain" ? Math.round(S.ob.weight + 3) : S.ob.weight; }
    render();
  },
  obNext() {
    const o = S.ob;
    if (o.step === 1 && !(o.height >= 120 && o.height <= 230 && o.weight >= 30 && o.weight <= 300)) { toast("Bitte Größe und Gewicht prüfen."); return; }
    if (o.step === 1) o.target = o.goal === "lose" ? Math.round(o.weight - 5) : o.goal === "gain" ? Math.round(o.weight + 3) : o.weight;
    if (o.step === 3 && ((o.goal === "lose" && o.target >= o.weight) || (o.goal === "gain" && o.target <= o.weight))) { toast(o.goal === "lose" ? "Das Zielgewicht sollte unter deinem Gewicht liegen." : "Das Zielgewicht sollte über deinem Gewicht liegen."); return; }
    if (o.step < 4) { o.step++; render(); window.scrollTo(0, 0); return; }
    S.profile = { sex: o.sex, birth: o.birth, height: o.height, weight: o.weight, target: o.goal === "maintain" ? o.weight : o.target, activity: o.activity, goal: o.goal, rate: o.goal === "maintain" ? 0 : o.rate, adaptive: true, offset: 0, lastAdapt: null, healthBridge: false, created: dayKey() };
    S.weights = [{ d: dayKey(), kg: o.weight }];
    Store.profile(); Store.weights();
    S.tab = "today"; S.ob = null; render(); OfflineDB.check();
  },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.closest("#sheet-root")) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset.arg, el, e);
});

async function importData(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { toast("Diese Datei ist kein FitTrack-Backup."); return; }
  if (!d || d.app !== "fittrack" || !d.profile) { toast("Diese Datei ist kein FitTrack-Backup."); return; }
  const n = Object.values(d.days || {}).reduce((a, x) => a + ((x && x.items) || []).length, 0);
  if (!confirm(`Backup vom ${new Date(d.exported || Date.now()).toLocaleDateString("de-DE")} mit ${n} Einträgen und ${(d.workouts || []).length} Trainings importieren? Deine aktuellen Daten auf diesem iPhone werden ersetzt.`)) return;
  applyData(d); Store.save(true); S.tab = "today"; render(); toast("Daten importiert");
}

// ---------- Start ----------
loadLocal();
render();
Store.init().finally(() => {
  S.ready = true;
  if (S.profile) adaptiveUpdate();
  if (!Sheet.stack.length) render();
  OfflineDB.check();
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
</script>
</body>
</html>
